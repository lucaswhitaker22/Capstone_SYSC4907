<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Offerings</title>
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            cursor: pointer;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            width: 70%;
            max-width: 500px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
        }
        .btn {
            padding: 8px 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Course Offerings</h1>
        <button class="btn btn-primary" onclick="showAddModal()">Add Offering</button>
        <table id="offeringsTable">
            <thead>
                <tr>
                    <th onclick="sortTable(0)">Course ID</th>
                    <th onclick="sortTable(1)">Section Type</th>
                    <th onclick="sortTable(2)">Section Code</th>
                    <th onclick="sortTable(3)">Day</th>
                    <th onclick="sortTable(4)">Time</th>
                    <th onclick="sortTable(5)">Capacity</th>
                    <th onclick="sortTable(6)">Enrollment</th>
                    <th onclick="sortTable(7)">Term</th>
                    <th onclick="sortTable(8)">Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="offeringsBody"></tbody>
        </table>
    </div>

    <!-- Add/Edit Modal -->
    <div id="offeringModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Course Offering</h2>
            <form id="offeringForm">
                <div class="form-group">
                    <label for="course_id">Course ID:</label>
                    <input type="text" id="course_id" required>
                </div>
                <div class="form-group">
                    <label for="section_type">Section Type:</label>
                    <select id="section_type" required>
                        <option value="LECTURE">Lecture</option>
                        <option value="LAB">Lab</option>
                        <option value="TUTORIAL">Tutorial</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="section_code">Section Code:</label>
                    <input type="text" id="section_code" required>
                </div>
                <div class="form-group">
                    <label for="day_of_week">Day:</label>
                    <select id="day_of_week" required>
                        <option value="1">Monday</option>
                        <option value="2">Tuesday</option>
                        <option value="3">Wednesday</option>
                        <option value="4">Thursday</option>
                        <option value="5">Friday</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="start_time">Start Time (HH:MM):</label>
                    <input type="time" id="start_time" required>
                </div>
                <div class="form-group">
                    <label for="end_time">End Time (HH:MM):</label>
                    <input type="time" id="end_time" required>
                </div>
                <div class="form-group">
                    <label for="capacity">Capacity:</label>
                    <input type="number" id="capacity" required>
                </div>
                <div class="form-group">
                    <label for="term">Term:</label>
                    <input type="text" id="term" required>
                </div>
                <div class="form-group">
                    <label for="academic_year">Academic Year:</label>
                    <input type="text" id="academic_year" required>
                </div>
                <input type="hidden" id="offering_id">
                <button type="submit" class="btn btn-primary">Save</button>
                <button type="button" class="btn" onclick="closeModal()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000/api';

        async function fetchOfferings() {
            try {
                const response = await fetch(`${API_URL}/offerings`);
                const offerings = await response.json();
                renderOfferings(offerings);
            } catch (error) {
                console.error('Error fetching offerings:', error);
            }
        }

        function renderOfferings(offerings) {
            const tbody = document.getElementById('offeringsBody');
            tbody.innerHTML = '';

            offerings.forEach(offering => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${offering.course_id}</td>
                    <td>${offering.section_type}</td>
                    <td>${offering.section_code}</td>
                    <td>${getDayName(offering.day_of_week)}</td>
                    <td>${offering.start_time}-${offering.end_time}</td>
                    <td>${offering.capacity}</td>
                    <td>${offering.current_enrollment}</td>
                    <td>${offering.term} ${offering.academic_year}</td>
                    <td>${offering.status}</td>
                    <td class="actions">
                        <button class="btn btn-primary" onclick="editOffering(${offering.offering_id})">Edit</button>
                        <button class="btn btn-danger" onclick="deleteOffering(${offering.offering_id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function saveOffering(event) {
            event.preventDefault();
            const offeringId = document.getElementById('offering_id').value;
            const isEdit = offeringId !== '';

            const offeringData = {
                course_id: document.getElementById('course_id').value,
                section_type: document.getElementById('section_type').value,
                section_code: document.getElementById('section_code').value,
                day_of_week: parseInt(document.getElementById('day_of_week').value),
                start_time: document.getElementById('start_time').value,
                end_time: document.getElementById('end_time').value,
                capacity: parseInt(document.getElementById('capacity').value),
                term: document.getElementById('term').value,
                academic_year: document.getElementById('academic_year').value
            };

            try {
                const url = isEdit ? `${API_URL}/offerings/${offeringId}` : `${API_URL}/offerings`;
                const method = isEdit ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(offeringData)
                });

                if (response.ok) {
                    closeModal();
                    fetchOfferings();
                } else {
                    const error = await response.json();
                    alert(error.error || 'Error saving offering');
                }
            } catch (error) {
                console.error('Error saving offering:', error);
                alert('Error saving offering');
            }
        }

        async function deleteOffering(offeringId) {
            if (confirm('Are you sure you want to delete this offering?')) {
                try {
                    const response = await fetch(`${API_URL}/offerings/${offeringId}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        fetchOfferings();
                    } else {
                        const error = await response.json();
                        alert(error.error || 'Error deleting offering');
                    }
                } catch (error) {
                    console.error('Error deleting offering:', error);
                    alert('Error deleting offering');
                }
            }
        }

        async function editOffering(offeringId) {
            try {
                const response = await fetch(`${API_URL}/offerings/${offeringId}`);
                const offering = await response.json();
                
                document.getElementById('modalTitle').textContent = 'Edit Course Offering';
                document.getElementById('offering_id').value = offeringId;
                document.getElementById('course_id').value = offering.course_id;
                document.getElementById('section_type').value = offering.section_type;
                document.getElementById('section_code').value = offering.section_code;
                document.getElementById('day_of_week').value = offering.day_of_week;
                document.getElementById('start_time').value = offering.start_time;
                document.getElementById('end_time').value = offering.end_time;
                document.getElementById('capacity').value = offering.capacity;
                document.getElementById('term').value = offering.term;
                document.getElementById('academic_year').value = offering.academic_year;
                
                showModal();
            } catch (error) {
                console.error('Error fetching offering:', error);
                alert('Error fetching offering details');
            }
        }

        function showAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Course Offering';
            document.getElementById('offeringForm').reset();
            document.getElementById('offering_id').value = '';
            showModal();
        }

        function showModal() {
            document.getElementById('offeringModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('offeringModal').style.display = 'none';
        }

        function getDayName(day) {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            return days[day - 1];
        }

        function sortTable(n) {
            const table = document.getElementById("offeringsTable");
            let switching = true;
            let dir = "asc";
            let switchcount = 0;

            while (switching) {
                switching = false;
                const rows = table.rows;

                for (let i = 1; i < (rows.length - 1); i++) {
                    let shouldSwitch = false;
                    const x = rows[i].getElementsByTagName("TD")[n];
                    const y = rows[i + 1].getElementsByTagName("TD")[n];

                    if (dir === "asc") {
                        if (x.innerHTML.toLowerCase() > y.innerHTML.toLowerCase()) {
                            shouldSwitch = true;
                            break;
                        }
                    } else if (dir === "desc") {
                        if (x.innerHTML.toLowerCase() < y.innerHTML.toLowerCase()) {
                            shouldSwitch = true;
                            break;
                        }
                    }

                    if (shouldSwitch) {
                        rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                        switching = true;
                        switchcount++;
                    }
                }

                if (switchcount === 0 && dir === "asc") {
                    dir = "desc";
                    switching = true;
                }
            }
        }

        // Fetch offerings when page loads
        document.addEventListener('DOMContentLoaded', fetchOfferings);
    </script>
</body>
</html>
