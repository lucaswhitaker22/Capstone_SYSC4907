<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Block Schedule</title>
    <style>
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .block-info { margin-bottom: 20px; padding: 15px; background-color: #f9f9f9; border-radius: 5px; }
        .calendar { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 40px; }
        .calendar th { background-color: #f2f2f2; padding: 10px; border: 1px solid #ddd; }
        .calendar td { border: 1px solid #ddd; height: 100px; vertical-align: top; padding: 5px; }
        .time-slot { position: relative; height: 60px; border-bottom: 1px dashed #eee; }
        .course-block { position: absolute; left: 2px; right: 2px; padding: 4px; border-radius: 3px; font-size: 12px; overflow: hidden; z-index: 1; }
        .course-block.LECTURE { background-color: #e3f2fd; border: 1px solid #90caf9; }
        .course-block.LAB { background-color: #f0f4c3; border: 1px solid #dce775; }
        .course-block.TUTORIAL { background-color: #f8bbd0; border: 1px solid #f48fb1; }
        .time-header { width: 80px; padding: 5px; text-align: right; font-size: 12px; color: #666; }
        .details-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .details-table th, .details-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .details-table th { background-color: #f2f2f2; }
        .details-table tr:nth-child(even) { background-color: #f9f9f9; }
        .details-table tr:hover { background-color: #f5f5f5; }
        #conflictAlert { display: none; padding: 15px; background-color: #ffebee; border: 1px solid #ffcdd2; margin: 10px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Block Schedule</h1>
        <div class="block-info" id="blockInfo"></div>
        <div id="conflictAlert"></div>
        <h2>Weekly Calendar</h2>
        <table class="calendar">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Monday</th>
                    <th>Tuesday</th>
                    <th>Wednesday</th>
                    <th>Thursday</th>
                    <th>Friday</th>
                </tr>
            </thead>
            <tbody id="calendarBody"></tbody>
        </table>
        <h2>Schedule Details</h2>
        <table class="details-table">
            <thead>
                <tr>
                    <th>Course ID</th>
                    <th>Section Type</th>
                    <th>Section Code</th>
                    <th>Day</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>

    <script>
       function getDayName(day) {
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    return days[day - 1];
}

function createTimeSlots() {
    const tbody = document.getElementById('calendarBody');
    const startHour = 8;
    const endHour = 18;
    for (let hour = startHour; hour < endHour; hour++) {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td class="time-header">${hour.toString().padStart(2, '0')}:00</td>
            <td id="1-${hour}" class="time-slot"></td>
            <td id="2-${hour}" class="time-slot"></td>
            <td id="3-${hour}" class="time-slot"></td>
            <td id="4-${hour}" class="time-slot"></td>
            <td id="5-${hour}" class="time-slot"></td>
        `;
        tbody.appendChild(row);
    }
}

function placeOffering(offering) {
    const startHour = parseInt(offering.start_time.split(':')[0]);
    const startMin = parseInt(offering.start_time.split(':')[1]);
    const endHour = parseInt(offering.end_time.split(':')[0]);
    const endMin = parseInt(offering.end_time.split(':')[1]);
    const duration = (endHour - startHour) * 60 + (endMin - startMin);
    const topOffset = (startMin / 60) * 100;
    const height = (duration / 60) * 100;
    const cell = document.getElementById(`${offering.day_of_week}-${startHour}`);
    
    if (cell) {
        const courseBlock = document.createElement('div');
        courseBlock.className = `course-block ${offering.section_type}`;
        courseBlock.style.top = `${topOffset}%`;
        courseBlock.style.height = `${height}%`;
        courseBlock.innerHTML = `
            ${offering.course_id}<br>
            ${offering.section_type} ${offering.section_code}<br>
            ${offering.start_time}-${offering.end_time}
        `;
        cell.appendChild(courseBlock);
    }
}

async function addOfferingToBlock(blockId, offeringId) {
    try {
        const response = await fetch(`/api/schedules/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                block_id: blockId,
                offering_id: offeringId 
            })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
            if (response.status === 409) {
                handleConflicts(data.conflicts);
            }
            throw new Error(data.message);
        }

        placeOffering(data);
        updateScheduleTable(data);
        return data;
    } catch (error) {
        console.error('Error adding offering:', error);
        throw error;
    }
}

function handleConflicts(conflicts) {
    const conflictAlert = document.getElementById('conflictAlert');
    conflictAlert.style.display = 'block';
    conflictAlert.innerHTML = `
        <strong>Time Conflict Detected:</strong><br>
        ${conflicts.map(conflict => 
            `${conflict.existing_course_id} (${conflict.existing_time}) conflicts with 
             ${conflict.new_course_id} (${conflict.new_time}) on ${getDayName(conflict.day_of_week)}`
        ).join('<br>')}
    `;
}

function updateScheduleTable(offering) {
    const row = document.createElement('tr');
    row.innerHTML = `
        <td>${offering.course_id}</td>
        <td>${offering.section_type}</td>
        <td>${offering.section_code}</td>
        <td>${getDayName(offering.day_of_week)}</td>
        <td>${offering.start_time}-${offering.end_time}</td>
    `;
    document.getElementById('scheduleBody').appendChild(row);
}

async function fetchBlockSchedule(blockId) {
    try {
        const [blockResponse, scheduleResponse] = await Promise.all([
            fetch(`http://127.0.0.1:5000/api/blocks/${blockId}`),
            fetch(`http://127.0.0.1:5000/api/schedules/block/${blockId}`)
        ]);

        if (!blockResponse.ok || !scheduleResponse.ok) {
            throw new Error('Failed to fetch schedule data');
        }

        const block = await blockResponse.json();
        const schedule = await scheduleResponse.json();

        updateBlockInfo(block);
        createTimeSlots();
        clearSchedule();
        renderSchedule(schedule);
    } catch (error) {
        console.error('Error:', error);
        showError(error.message);
    }
}

function updateBlockInfo(block) {
    document.getElementById('blockInfo').innerHTML = `
        <h2>Block ${block.block_id}</h2>
        <p>Program: ${block.program_id}</p>
        <p>Term: ${block.term} ${block.academic_year}</p>
        <p>Block Size: ${block.block_size}</p>
        <p>Rating: ${block.schedule_rating || 'Not rated'}</p>
    `;
}

function clearSchedule() {
    document.getElementById('scheduleBody').innerHTML = '';
}

function renderSchedule(schedule) {
    schedule.forEach(offering => {
        placeOffering(offering);
        updateScheduleTable(offering);
    });
}

function showError(message) {
    document.getElementById('blockInfo').innerHTML = `
        <div class="error">Error loading schedule: ${message}</div>
    `;
}

document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const blockId = urlParams.get('blockId') || 'F_ENG_1';
    fetchBlockSchedule(blockId);
});
    </script>
</body>
</html>
