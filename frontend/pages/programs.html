<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Academic Programs</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Academic Programs</h1>
        <table>
            <thead>
                <tr>
                    <th>Program ID</th>
                    <th>Program Name</th>
                    <th>Total Enrollment</th>
                    <th>20-Student Blocks</th>
                    <th>10-Student Blocks</th>
                </tr>
            </thead>
            <tbody id="programsBody"></tbody>
        </table>
    </div>

    <script>
        async function fetchPrograms() {
            try {
                const response = await fetch('http://127.0.0.1:5000/api/programs');
                const programs = await response.json();
                
                const tbody = document.getElementById('programsBody');
                tbody.innerHTML = '';

                programs.forEach(program => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${program.program_id}</td>
                        <td>${program.program_name}</td>
                        <td>${program.total_enrollment}</td>
                        <td>${program.blocks_20_count}</td>
                        <td>${program.blocks_10_count}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchPrograms);
    </script>
</body>
</html>
